[package]
name = "uwatch"
version = "0.3.0"
edition = "2021"
description = "Filesystem change history grouped into quiet-period batches"
license = "MIT"
repository = "https://github.com/aliev/udiff"
homepage = "https://github.com/aliev/udiff"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"

chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
ignore = "0.4"
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "3.2"

[dev-dependencies]
tempfile = "3.20"
