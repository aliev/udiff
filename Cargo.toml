[package]
name = "udiff"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["Ali Aliyev <ali@aliev.me>"]
description = "A focused terminal UI for code review"
license = "MIT"
readme = "README.md"
repository = "https://github.com/aliev/udiff"
homepage = "https://github.com/aliev/udiff"
keywords = ["code-review", "diff", "patch", "terminal", "tui"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github/", "/AGENTS.md", "/docs/assets/"]

[features]
default = ["watch"]
watch = ["dep:diffwatch"]

[dependencies]
anyhow = "1"
base64 = "0.23"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
diffwatch = { path = "diffwatch", optional = true }
ratatui = "0.30"
regex = "1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
tui-tree-widget = "0.24"
unicode-width = "0.2"

[workspace]
members = ["diffwatch"]
resolver = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dist]
inherits = "release"
lto = "thin"
